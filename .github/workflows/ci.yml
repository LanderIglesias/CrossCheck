name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: crosscheck
          POSTGRES_USER: crosscheck
          POSTGRES_PASSWORD: crosscheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://crosscheck:crosscheck@localhost:5432/crosscheck
      SEC_USER_AGENT: "CrossCheck CI ci@example.com"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: mypy src scripts
      - run: bandit -r src scripts
      - run: for f in db/migrations/*.sql; do psql "$DATABASE_URL" -f "$f"; done
      - run: pytest
