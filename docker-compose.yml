services:
  db:
    image: pgvector/pgvector:pg16
    container_name: crosscheck_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - crosscheck_postgres_data:/var/lib/postgresql/data

volumes:
  crosscheck_postgres_data:
