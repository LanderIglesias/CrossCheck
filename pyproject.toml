[project]
name = "crosscheck"
version = "0.1.0"
description = "Multimodal disclosure-consistency engine: reconciles earnings call audio, investor decks, and SEC filings/XBRL into linked, evidence-grounded claims."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "psycopg[binary]>=3.2",
  "requests>=2.32",
  "streamlit>=1.38",
  "beautifulsoup4>=4.12",
  "FlagEmbedding>=1.2",
  "rank_bm25>=0.2",
  "numpy>=1.26",
  "faster-whisper>=1.0",
  "pyannote.audio>=3.3",
  "jiwer>=3.0",
  "anthropic>=0.40",
  "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "black>=24.8",
  "mypy>=1.11",
  "bandit>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosscheck"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["crosscheck"]

[tool.mypy]
python_version = "3.12"
packages = ["crosscheck"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
